version = 1

# A license text goes into LICENSES/ with the first file that uses it; `reuse lint` names it when it is missing.
# Names and logos take LicenseRef-Brand as an override annotation.

# Code and everything not matched below: MIT.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Eike Landin"
SPDX-License-Identifier = "MIT"

# The CedarLoom name and logos, which the site serves from brand/: LICENSES/LicenseRef-Brand.txt.
[[annotations]]
path = "brand/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 CedarLoom contributors"
SPDX-License-Identifier = "LicenseRef-Brand"

# The palette and font tokens, copied from CedarLoom/cedarloom: code license.
[[annotations]]
path = "brand/tokens.css"
precedence = "override"
SPDX-FileCopyrightText = "2026 Eike Landin"
SPDX-License-Identifier = "MIT"

# Albert Sans, self-hosted; brand/fonts/OFL.txt is its license as shipped with the font.
[[annotations]]
path = "brand/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2021 The Albert Sans Project Authors (https://github.com/usted/Albert-Sans)"
SPDX-License-Identifier = "OFL-1.1"
