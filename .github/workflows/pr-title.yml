name: PR title

# Pull requests into main are squash-merged with their title as the commit message: the title follows Conventional
# Commits. Keep the check named `conventional`; main requires it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    if: github.repository_owner == 'CedarLoom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          # The title becomes the squash commit: no em dash or emoji (checks.yml, Forbidden characters).
          subjectPattern: ^[^—⌀-⏿☀-➿⬀-⯿️\uD83C-\uD83E]+$
          subjectPatternError: The title must not contain an em dash or an emoji.
