name: PR title

# Pull requests into main are squash-merged with their title as the commit message: the title follows Conventional
# Commits. Keep the check named `conventional`; main requires it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    if: github.repository_owner == 'CedarLoom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          # The title becomes the squash commit: no em dash or emoji, as scripts/check.sh checks for the files.
          subjectPattern: ^[^\u2014\u2300-\u23FF\u2600-\u27BF\u2B00-\u2BFF\uFE0F\uD83C-\uD83E]+$
          subjectPatternError: The title must not contain an em dash or an emoji.
