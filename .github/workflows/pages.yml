name: Pages

# Builds the site in site/ on pull requests and, from main, publishes it to the root of the gh-pages branch, which
# GitHub Pages serves. The deploy keeps pr-preview/, the previews of .github/workflows/preview.yml, and rebases instead
# of force-pushing so a preview pushed at the same time survives.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/**"
      - ".github/actions/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "brand/**"
      - ".github/actions/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# A deploy on main is never cancelled by the next push; it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.repository == 'CedarLoom/app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/site
      - name: Types
        run: npm run typecheck
      - name: Test
        run: npm test
      # onBrokenLinks, onBrokenAnchors and onBrokenMarkdownLinks are `throw`: a broken link fails the build. The token
      # lifts the anonymous rate limit of the stars and forks the navbar shows.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.repository == 'CedarLoom/app' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The deploy action pushes to gh-pages from this checkout with its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/build
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site/build
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
