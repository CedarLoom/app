name: Setup
description: Node.js, pnpm and the workspace dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
    # pnpm at the version and integrity of .github/pnpm/package-lock.json; its install script puts the native binary in place.
    - run: npm ci --prefix .github/pnpm --no-audit --no-fund && echo "$GITHUB_WORKSPACE/.github/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      shell: bash
    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
