name: Site setup
description: Node.js and the dependencies of the site in site/.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
    # No install scripts: the site needs none.
    - run: npm ci --ignore-scripts --no-audit --no-fund
      shell: bash
      working-directory: site
