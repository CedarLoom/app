packages:
  - packages/*

# One version per dependency across the workspace; packages refer to it as "catalog:".
catalog:
  "@biomejs/biome": 2.6.8
  "@fastify/helmet": 13.2.0
  "@fastify/swagger": 9.9.5
  "@lingui/format-po": 6.12.0
  "@lingui/message-utils": 6.12.0
  "@types/node": 26.6.6
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  jscpd: 5.4.3
  knip: 6.45.1
  lefthook: 2.2.2
  oxlint: 1.94.0
  openapi-types: 12.1.3
  oxlint-tsgolint: 7.0.2007
  typescript: 7.0.2
  vitest: 5.1.0
  zod: 4.6.7

# lefthook's postinstall would install git hooks; `pnpm exec lefthook install` does that on request.
allowBuilds:
  lefthook: false

catalogMode: strict
strictPeerDependencies: true
savePrefix: ""
# Dependency cooldown of 3 days: pnpm resolves no version younger than this, transitive ones included.
minimumReleaseAge: 4320

# picomatch ReDoS advisory (withdrawn): reached only by dev tools (knip, vitest), never by the app. Ignored here and in
# .github/dependency-review-config.json; remove both when `pnpm audit` no longer reports it.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
